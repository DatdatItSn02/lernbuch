name: rollback

# Bấm chạy trong tab Actions để đổi trang về bản trước. Không đụng database.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ssh-lernbuch.alwaysdata.net
      SSH_USER: lernbuch
      SITE_URL: https://lernbuch.alwaysdata.net
    steps:
      - uses: actions/checkout@v4
      - name: Nạp khoá SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ALWAYSDATA_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Quay lại bản trước
        run: |
          set -o pipefail
          { ssh "$SSH_USER@$SSH_HOST" "bash ~/lernbuch/bin/remote-rollback.sh"
            ve=$(ssh "$SSH_USER@$SSH_HOST" 'basename "$(readlink -f ~/lernbuch/current)"')
            # Chờ trang chủ báo đúng bản vừa quay về (PHP có thể còn nhớ đường dẫn current cũ), rồi mới kiểm /up
            dang=""
            for i in $(seq 1 24); do
              dang=$(curl -sS --max-time 15 "$SITE_URL/" 2>/dev/null | grep -o 'Bản [0-9]*-[0-9a-f]*' | head -1 || true)
              [ "$dang" = "Bản $ve" ] && break
              sleep 10
            done
            up=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/up" || true)
            echo "Sau khi quay lại: web chạy ${dang:-?}, /up trả ${up:-?}"
            if [ "$dang" != "Bản $ve" ]; then echo "✘ Sau 240 giây web vẫn chưa chạy bản $ve"; exit 1
            elif [ "$up" != "200" ]; then echo "✘ /up trả ${up:-?} sau khi quay lại"; exit 1
            else echo "✔ Web chạy bản trước ($ve), /up trả 200"; fi; } 2>&1 | tee /tmp/rollback.log
      - name: Ghi tóm tắt vào nhánh ci-results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/report.sh rollback "${{ job.status }}" /tmp/rollback.log
