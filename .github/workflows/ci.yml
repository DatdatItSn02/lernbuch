name: ci

on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # chỉ để ghi tóm tắt kết quả vào nhánh ci-results

jobs:
  php:
    name: php (PHP 8.4, MariaDB 11.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lernbuch
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, bcmath
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: pip install --quiet pymysql jsonschema
      - name: Kiểm tra PHP và database
        run: bash .github/scripts/php-checks.sh 2>&1 | tee /tmp/php.log; exit ${PIPESTATUS[0]}
      - name: Ghi tóm tắt vào nhánh ci-results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/report.sh php "${{ job.status }}" /tmp/php.log

  web:
    name: web (TypeScript, ESLint, Vitest, Vite, tương phản, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # App học cần đăng nhập: Playwright đăng nhập bằng tài khoản thử (NguoiHocThuSeeder) trên database này
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: lernbuch
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lernbuch
      DB_USERNAME: root
      DB_PASSWORD: root
      # Phiên lưu trong database như trên alwaysdata (Cài đặt đọc danh sách máy đang đăng nhập từ bảng sessions)
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Kiểm tra giao diện
        run: bash .github/scripts/web-checks.sh 2>&1 | tee /tmp/web.log; exit ${PIPESTATUS[0]}
      - name: Ghi tóm tắt vào nhánh ci-results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ảnh trang chào và trang quản trị cho báo cáo (tests/e2e/anh.spec.ts)
          REPORT_IMAGES: test-results/anh
        run: bash .github/scripts/report.sh web "${{ job.status }}" /tmp/web.log

  deploy:
    name: deploy lên lernbuch.alwaysdata.net
    needs: [php, web]
    # Tắt sẵn: bật bằng biến DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables).
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-production
    env:
      SSH_HOST: ssh-lernbuch.alwaysdata.net
      SSH_USER: lernbuch
      SITE_URL: https://lernbuch.alwaysdata.net
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, bcmath
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Đóng gói (vendor không có gói dev, file Vite đã build)
        run: |
          set -eo pipefail
          { composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
            npm ci --no-audit --no-fund && npm run build
            NAME="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
            echo "$NAME" > RELEASE
            tar czf "/tmp/$NAME.tgz" --exclude=./.git --exclude=./node_modules --exclude=./tests --exclude=./storage \
              --exclude=./.github --exclude=./import --exclude=./tools --exclude=./design --exclude=./public/hot \
              --exclude=./.env --exclude='*.md' .
            python3 .github/scripts/env-production.py > "/tmp/$NAME.env"
            echo "NAME=$NAME" >> "$GITHUB_ENV"
            ls -lh "/tmp/$NAME.tgz"; } 2>&1 | tee /tmp/deploy.log
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      - name: Nạp khoá SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ALWAYSDATA_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Trạng thái trước khi deploy (bản đang chạy, /up, dung lượng, nhịp lịch và hàng đợi)
        run: |
          { echo "Trước deploy: /up trả $(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/up" || true)"
            ssh "$SSH_USER@$SSH_HOST" 'cd ~/lernbuch 2>/dev/null && echo "Bản đang chạy: $(basename "$(readlink -f current)")" && du -sh releases/* shared . 2>/dev/null | sed "s/^/Dung lượng: /"' || true
            # Hai tác vụ định kỳ (schedule:run, queue:work) ghi một nhịp mỗi phút; thiếu nhịp là tác vụ trên alwaysdata đã dừng
            ssh "$SSH_USER@$SSH_HOST" 'php ~/lernbuch/current/artisan app:kiem-nhip -n 2>/dev/null | head -1' || true; } 2>&1 | tee -a /tmp/deploy.log
      - name: Đưa lên alwaysdata, migrate, đổi bản
        run: |
          set -o pipefail
          { ssh "$SSH_USER@$SSH_HOST" 'mkdir -p ~/lernbuch/incoming ~/lernbuch/bin'
            scp "/tmp/$NAME.tgz" "/tmp/$NAME.env" "$SSH_USER@$SSH_HOST:lernbuch/incoming/"
            scp deploy/remote-deploy.sh deploy/remote-rollback.sh deploy/remote-check.sh "$SSH_USER@$SSH_HOST:lernbuch/bin/"
            ssh "$SSH_USER@$SSH_HOST" "bash ~/lernbuch/bin/remote-deploy.sh $NAME"; } 2>&1 | tee -a /tmp/deploy.log
      - name: Kiểm /up, lỗi thì tự quay lại bản trước
        run: |
          # PHP trên máy chủ nhớ đường dẫn thật của current một lúc (realpath cache, mặc định 120 giây),
          # nên ngay sau khi đổi bản, web có thể vẫn chạy bản cũ. Chờ tới khi trang chủ báo đúng bản mới rồi mới kiểm /up,
          # nếu không /up 200 của bản cũ sẽ làm tưởng bản mới chạy tốt.
          moi=""
          for i in $(seq 1 24); do
            if curl -sS --max-time 15 "$SITE_URL/" 2>/dev/null | grep -q "Bản $NAME"; then moi=1; echo "✔ Web đã chạy bản $NAME sau khoảng $(( (i-1)*10 )) giây" | tee -a /tmp/deploy.log; break; fi
            sleep 10
          done
          [ -n "$moi" ] || echo "✘ Sau 240 giây trang chủ vẫn chưa báo bản $NAME" | tee -a /tmp/deploy.log
          for i in 1 2 3 4 5 6; do
            [ -n "$moi" ] || break
            up=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/up" || true)
            if [ "$up" = "200" ]; then
              echo "✔ /up trả 200 ($NAME)" | tee -a /tmp/deploy.log
              ssh "$SSH_USER@$SSH_HOST" "touch ~/lernbuch/releases/$NAME/.da-kiem"
              exit 0
            fi
            echo "lần $i: /up trả ${up:-không kết nối được}"
            sleep 10
          done
          home=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
          echo "✘ /up trả ${up:-?}, trang chủ trả ${home:-?}" | tee -a /tmp/deploy.log
          # Tự gọi /up bên trong PHP trên máy chủ để biết lỗi do app hay do cấu hình site
          ssh "$SSH_USER@$SSH_HOST" "bash ~/lernbuch/bin/remote-check.sh" 2>&1 | tee /tmp/check.log | tee -a /tmp/deploy.log
          if grep -q 'app tự trả /up: 200' /tmp/check.log; then
            cu=$(curl -sS --max-time 15 "$SITE_URL/" 2>/dev/null | grep -o 'Bản [0-9]*-[0-9a-f]*' | head -1 || true)
            if [ -n "$cu" ]; then
              echo "Gợi ý: bản mới chạy tốt trên máy chủ nhưng web vẫn chạy $cu (PHP còn nhớ bản cũ). alwaysdata → Web → Sites → sửa site → ô php.ini thêm: opcache.revalidate_path = 1 và realpath_cache_ttl = 1 (docs/huong-dan-alwaysdata.md)." | tee -a /tmp/deploy.log
            else
              echo "Gợi ý: app trên máy chủ chạy tốt nhưng địa chỉ web không trỏ vào app. alwaysdata → Web → Sites → sửa site: Root directory = /lernbuch/current/public, PHP 8.4 (docs/huong-dan-alwaysdata.md)." | tee -a /tmp/deploy.log
            fi
          fi
          echo "Quay lại bản trước" | tee -a /tmp/deploy.log
          ssh "$SSH_USER@$SSH_HOST" "bash ~/lernbuch/bin/remote-rollback.sh" 2>&1 | tee -a /tmp/deploy.log
          # Lại chờ PHP thôi nhớ đường dẫn cũ, rồi ghi bản web đang chạy và /up
          for i in $(seq 1 24); do
            curl -sS --max-time 15 "$SITE_URL/" 2>/dev/null | grep -q "Bản $NAME" || break
            sleep 10
          done
          dang=$(curl -sS --max-time 15 "$SITE_URL/" 2>/dev/null | grep -o 'Bản [0-9]*-[0-9a-f]*' | head -1 || true)
          echo "Sau khi quay lại: web chạy ${dang:-?}, /up trả $(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/up" || true)" | tee -a /tmp/deploy.log
          exit 1
      - name: Ghi tóm tắt vào nhánh ci-results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/report.sh deploy "${{ job.status }}" /tmp/deploy.log
